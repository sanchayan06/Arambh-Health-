<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Add Staff - JeevanSetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <h2>JeevanSetu</h2>
                    <p>Patient Management System</p>
                </div>

                <button  type="button" class="sidebar-toggle-btn"  id="sidebarToggleBtn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
                <span class="sidebar-toggle-icon"></span>
                </button>

            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="Patient.html" id="addPatientLink">Add Patient</a>
                <a href="Consultation.html">Consultation</a>
                <a href="manage-staff.html" id="adminWorkLink" class="active">Admin Work</a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>

        </aside>

        <main class="dashboard-content">

            <div class="page-header">
                <h1>Add Staff</h1>
                <p>Create a new Doctor or Receptionist account.</p>
            </div>

            <section class="form-card">

                <form id="staffForm">

                    <div class="form-group">
                        <label for="staffName">Full Name</label>
                        <input type="text" id="staffName" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label for="staffEmail">Email Address</label>
                        <input type="email" id="staffEmail" placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label for="staffPhone">Phone Number</label>
                        <input type="tel" id="staffPhone" placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="staffRole">Role</label>

                        <select id="staffRole" required>
                            <option value="">Select Role</option>
                            <option value="doctor">Doctor</option>
                            <option value="receptionist">Receptionist</option>
                        </select>
                    </div>

                    <div class="password-info">
                        <h3>Default Password</h3>
                        <p>Doctor: 123@doctor</p>
                        <p>Receptionist: 123@receptionist</p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Add Staff</button>
                        <button type="button" class="secondary-btn" onclick="window.location.href='manage-staff.html'">Cancel</button>
                    </div>

                </form>

            </section>

        </main>

    </div>

    <script src="Script.js"></script>
</body>
</html>

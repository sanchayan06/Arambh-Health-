<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dashboard - JeevanSetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button  type="button" class="sidebar-toggle-btn"  id="sidebarToggleBtn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
        <span class="sidebar-toggle-icon"></span>
    </button>

    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-logo">
                <h2>JeevanSetu</h2>
                <p>Patient Management System</p>
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="active">
                    Dashboard
                </a>

                <a href="Patient.html" id="addPatientLink">
                    Add Patient
                </a>

                <a href="Consultation.html">
                    Consultation
                </a>

                <a href="manage-staff.html" id="adminWorkLink">
                    Admin Work
                </a>

            </nav>

            <button id="logoutBtn" class="logout-btn" type="button">
                Logout
            </button>

        </aside>

        <main class="dashboard-content">

            <header class="dashboard-header">

                <div>
                    <h1>Dashboard</h1>
                    <p>Patient Record Management</p>
                </div>

            </header>

            <section class="stats-container">

                <div class="stat-card">
                    <h3>Total Patients</h3>
                    <p id="totalPatients">0</p>
                </div>

                <div class="stat-card">
                    <h3>Total Consultations</h3>
                    <p id="totalConsultations">0</p>
                </div>

                <div class="stat-card">
                    <h3>Patients Today</h3>
                    <p id="todayPatients">0</p>
                </div>

            </section>

            <section class="patient-section">

                <div class="section-header">

                    <div>
                        <h2>Patient Records</h2>
                        <p>Search and manage patient records.</p>
                    </div>

                    <input
                        type="text"
                        id="searchPatient"
                        placeholder="Search by patient name or ID"
                    >

                </div>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Gender</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="patientTableBody"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="Script.js"></script>

</body>
</html>

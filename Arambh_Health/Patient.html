<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Add Patient - JeevanSetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <h2>JeevanSetu</h2>
                    <p>Patient Management System</p>
                </div>
                
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="Patient.html" id="addPatientLink" class="active">Add Patient</a>
                <a href="Consultation.html">Consultation</a>
                <a href="manage-staff.html" id="adminWorkLink">Admin Work</a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>

            <button  type="button" class="sidebar-toggle-btn"  id="sidebarToggleBtn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
                <span class="sidebar-toggle-icon"></span>
            </button>
        </aside>
        <main class="dashboard-content">

            <div class="page-header">
                <h1>Register Patient</h1>
                <p>Create a new patient record.</p>
            </div>

            <section class="form-card">

                <form id="patientForm">

                    <div class="form-group">
                        <label for="patientName">Full Name</label>
                        <input type="text" id="patientName" placeholder="Enter patient name" required>
                    </div>

                    <div class="form-group">
                        <label for="patientAge">Age</label>
                        <input type="number" id="patientAge" placeholder="Enter age" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="patientGender">Gender</label>
                        <select id="patientGender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="patientPhone">Phone Number</label>
                        <input type="tel" id="patientPhone" placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label for="patientAddress">Address</label>
                        <textarea id="patientAddress" placeholder="Enter patient address"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Register Patient</button>
                        <button type="button" class="secondary-btn" onclick="window.location.href='dashboard.html'">Cancel</button>
                    </div>

                </form>

            </section>

        </main>

    </div>

    <script src="Script.js"></script>
</body>
</html>

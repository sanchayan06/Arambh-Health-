<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JeevanSetu - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <!-- BACK TO HOME BUTTON -->

    <button type="button" id="backHomeBtn" class="back-home-btn"
>       ← Back to Home Page
    </button>


    <main class="login-container">

        <section class="login-card">

            <h1>JeevanSetu</h1>

            <p>
                Patient Case-Taking & Record Management System
            </p>

            <form id="loginForm">

                <!-- HOSPITAL SEARCH -->

                <label for="hospitalSearch">
                    Search & Select Hospital
                </label>

                <div class="hospital-search-wrapper">

                    <input
                        type="text"
                        id="hospitalSearch"
                        placeholder="Search hospital name..."
                        autocomplete="off"
                    >

                    <div
                        id="hospitalResults"
                        class="hospital-results"
                    ></div>

                </div>

                <input
                    type="hidden"
                    id="hospitalId"
                    name="hospitalId"
                >


                <!-- FULL NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- ROLE -->

                <label for="role">
                    Login As
                </label>

                <select id="role" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="doctor">
                        Doctor
                    </option>

                    <option value="receptionist">
                        Receptionist
                    </option>

                </select>


                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >


                <!-- PHONE -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="showPasswordBtn"
                        class="show-password-btn"
                    >
                        Show
                    </button>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <!-- FORGOT PASSWORD -->

                <button
                    type="button"
                    id="forgotPasswordBtn"
                    class="forgot-password-link"
                >
                    Forgot Password?
                </button>


                <!-- HELP TEXT -->

                <p class="login-help-text">

                    <b>
                        Default credentials are provided by the system administrator.
                    </b>

                </p>

            </form>

        </section>

    </main>

    <script src="Script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Edit Staff - JeevanSetu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <h2>JeevanSetu</h2>
                    <p>Patient Management System</p>
                </div>

                <button id="sidebarMoveBtn" class="sidebar-move-btn" type="button" aria-label="Move Sidebar" title="Move Sidebar">
                    <span class="sidebar-icon"></span>
                </button>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="Patient.html" id="addPatientLink">Add Patient</a>
                <a href="Consultation.html">Consultation</a>
                <a href="manage-staff.html" id="adminWorkLink" class="active">Admin Work</a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
            </div>

        </aside>

        <main class="dashboard-content">

            <div class="page-header">
                <h1>Edit Staff Details</h1>
                <p>Update staff account information.</p>
            </div>

            <section class="form-card">

                <form id="editStaffForm">

                    <div class="form-group">
                        <label for="editStaffName">Full Name</label>
                        <input type="text" id="editStaffName" required>
                    </div>

                    <div class="form-group">
                        <label for="editStaffEmail">Email Address</label>
                        <input type="email" id="editStaffEmail" required>
                    </div>

                    <div class="form-group">
                        <label for="editStaffPhone">Phone Number</label>
                        <input type="tel" id="editStaffPhone" required>
                    </div>

                    <div class="form-group">
                        <label for="editStaffJoiningDate">Date of Joining</label>
                        <input type="date" id="editStaffJoiningDate" required>
                    </div>

                    <div class="form-group">
                        <label for="editStaffRole">Role</label>

                        <select id="editStaffRole" required>
                            <option value="doctor">Doctor</option>
                            <option value="receptionist">Receptionist</option>
                        </select>
                    </div>

                    <div class="password-info">
                        <h3>Password</h3>
                        <p><b>Password cannot be edited from this page. Use Reset Password from Staff Management.</b></p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Save Changes</button>
                        <button type="button" class="secondary-btn" onclick="window.location.href='manage-staff.html'">Cancel</button>
                    </div>

                </form>

            </section>

        </main>

    </div>

    <script src="Script.js"></script>
</body>
</html>
